r.textContent='Identifiants incorrects'}}async function loadR(){try{const d=await api('reservations?select=nom,date_debut,materiel&order=date_debut.asc');rows.innerHTML='';d.forEach(x=>{let m={};try{m=JSON.parse(x.materiel||'{}')}catch{}rows.innerHTML+=`<tr><td>${x.nom||''}</td><td>${x.date_debut||''}</td><td>Tables ${m.tables||0} · Bancs ${m.bancs||0} · Tonnelles ${m.tonnelles||0}</td></tr>`})}catch(err){rows.innerHTML=`<tr><td colspan='3'>${err.message}</td></tr>`}}</script></body></html>
