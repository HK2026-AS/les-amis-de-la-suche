<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Les Amis de la Suche</title>
<style>
body{font-family:system-ui;margin:0;background:#eef5e8}
.login,.app{max-width:700px;margin:40px auto;background:#fff;padding:24px;border-radius:16px}
input,button{width:100%;padding:12px;margin:8px 0}
table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:8px}
</style>
</head>
<body>
<div class="login" id="login">
<h2>Connexion</h2>
<input id="u" placeholder="Identifiant">
<input id="p" type="password" placeholder="Mot de passe">
<button onclick="login()">Se connecter</button>
<p id="err" style="color:red"></p>
</div>
<div class="app" id="app" style="display:none">
<h2>Réservations</h2>
<p>Connexion réussie. Cette version est le point de départ pour la synchro Supabase.</p>
<table><thead><tr><th>Client</th><th>Date</th><th>Matériel</th></tr></thead><tbody id="rows"></tbody></table>
</div>
<script>
const URL="https://gvrigsvwmqclwjxbwmpy.supabase.co";
const KEY="sb_publishable_XCU-0-WMqWfhSR-u-0Acsg_HExQpwP_";
async function api(path,opt={}){
 const r=await fetch(URL+"/rest/v1/"+path,{...opt,headers:{apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json",Prefer:"return=representation",...(opt.headers||{})}});
 if(!r.ok) throw new Error(await r.text()); return r.json();
}
async function load(){
 const data=await api("reservation?select=nom,date_debut,materiel&order=date_debut.asc");
 const b=document.getElementById("rows"); b.innerHTML="";
 data.forEach(r=>{const m=JSON.parse(r.materiel||"{}"); b.innerHTML+=`<tr><td>${r.nom}</td><td>${r.date_debut}</td><td>T:${m.tables||0} B:${m.bancs||0} To:${m.tonnelles||0}</td></tr>`});
}
function login(){
 if(u.value==="admin"&&p.value==="admin"){login.style.display="none";app.style.display="block";load();} else err.textContent="Identifiant ou mot de passe incorrect";
}
</script>
</body></html>
